#cloud-config
# Bootstraps the Linode with Docker and nothing else. Equivalent to the Akamai workshop's
# deploy/cloud-init.yaml; if you want byte-for-byte parity, diff it against the copy in
# akamai-developers/akamai-workshop-hackmidwest.
#
# NEVER put secrets in here. cloud-init user-data is readable back from the Linode
# metadata service and from the Cloud Manager UI. Tokens and keys go in .env, copied
# over SSH after the machine is up.

package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-v2

runcmd:
  - systemctl enable --now docker
  # Linode's Ubuntu images ship with no default non-root user — you log in as root.
  # So no `usermod -aG docker ubuntu` here: that user does not exist and the command
  # would fail. Creating one would mean putting its SSH key in user-data, which is
  # readable back from the metadata service.
  # Where the repo and .env go.
  - install -d -m 0755 /opt/coordinator
